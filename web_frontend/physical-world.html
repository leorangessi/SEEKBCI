<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物理世界 - SEEKBCI PLAT</title>
<link rel="stylesheet" href="css/app-shell.css?v=20260714g">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#121212;color:#fff}
.pw-page{padding:20px 0 44px}
.btn{padding:8px 14px;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:13px;transition:all .2s}
.btn-primary{background:#00D9FF;color:#000}.btn-primary:hover{background:#33e2ff}
.btn-secondary{background:#2A2A2A;color:#ccc;border:1px solid #555}.btn-secondary:hover{background:#333}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#f44336;color:#fff}.btn-danger:hover{background:#e53935}
.btn-green{background:#4CAF50;color:#fff}.btn-green:hover{background:#66bb6a}
.btn-orange{background:#FF9800;color:#000}.btn-orange:hover{background:#ffad33}
.tag{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;margin:2px 4px 2px 0}
.tag-ok{background:rgba(76,175,80,.12);border:1px solid rgba(76,175,80,.28);color:#a5e8a8}
.tag-off{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.28);color:#ffb4ad}
.tag-blue{background:rgba(0,217,255,.1);border:1px solid rgba(0,217,255,.22);color:#a8efff}
.empty-hint{border:1px dashed #444;border-radius:10px;padding:16px;color:#666;text-align:center;font-size:13px;line-height:1.6}
.panel{background:#1E1E1E;border:1px solid #333;border-radius:14px;padding:16px}
.panel h4{color:#00D9FF;font-size:14px;margin-bottom:8px}

/* === Layout: 2-column, left tall + right stacked === */
.pw-layout{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;gap:14px;min-height:700px}
.pw-layout .pw-discovery{grid-row:1/3}
.pw-layout .pw-top-right{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pw-layout .pw-bottom-right{display:grid;grid-template-columns:1fr 120px;gap:14px}
@media(max-width:960px){.pw-layout{grid-template-columns:1fr;grid-template-rows:auto}}

/* Target five-zone layout */
.pw-layout{grid-template-columns:minmax(300px,36%) minmax(0,1fr);grid-template-rows:minmax(300px,2fr) minmax(390px,3fr);min-height:740px;height:calc(100vh - 150px)}
.pw-layout .pw-discovery{grid-column:1;grid-row:1/3;min-height:0;height:100%;overflow:hidden}
.pw-layout .pw-top-right{grid-column:2;grid-row:1;grid-template-columns:minmax(230px,.94fr) minmax(260px,1.06fr);gap:40px;min-width:0;min-height:0}
.pw-layout .pw-top-right>.panel{min-width:0;min-height:0;height:100%;overflow:auto}
.pw-layout .pw-bottom-right{grid-column:2;grid-row:2;grid-template-columns:minmax(0,1fr) 88px;gap:16px;min-width:0;min-height:0}
.pw-layout .pw-bottom-right>.rule-canvas{height:100%;min-height:390px}
.pw-layout .rl-panel{min-width:0;align-self:start}
@media(max-width:1080px){
  .pw-layout{grid-template-columns:280px minmax(0,1fr)}
  .pw-layout .pw-top-right{grid-template-columns:1fr 1fr;gap:14px}
  .pw-layout .pw-bottom-right{grid-template-columns:minmax(0,1fr) 92px}
}
@media(max-width:820px){
  .pw-layout{display:flex;flex-direction:column;height:auto;min-height:0}
  .pw-layout .pw-discovery{min-height:420px;height:auto;overflow:visible}
  .pw-layout .pw-top-right{grid-template-columns:1fr}
  .pw-layout .pw-bottom-right{grid-template-columns:1fr}
  .pw-layout .rl-panel{display:grid;grid-template-columns:repeat(4,minmax(76px,1fr));align-items:start}
  .pw-layout .rl-panel h4,.pw-layout .rl-panel #rl-tabs{grid-column:1/-1}
}

/* Device discovery */
.scan-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.device-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.dev-card{background:#252525;border:2px solid #333;border-radius:10px;padding:9px 11px;cursor:grab;transition:all .2s;user-select:none}
.dev-card:hover{border-color:#00D9FF}
.dev-card.selected{border-color:#00D9FF;background:rgba(0,217,255,.06)}
.dev-card.active-sel{border-color:#7c4dff;box-shadow:0 0 0 2px rgba(124,77,255,.3)}
.dev-card.offline{opacity:.45}
.dev-card .dev-name{font-weight:600;font-size:12px;color:#eaf8ff}
.dev-card .dev-meta{font-size:10px;color:#82909a;margin-top:2px}
.dev-card .dev-actions{display:flex;gap:5px;margin-top:5px}
.dev-card.dragging{opacity:.5;border-color:#7c4dff}
.status-bar{background:#151a1f;border:1px solid #303842;border-radius:8px;padding:6px 10px;color:#b9c7d0;font-size:11px;margin-top:8px;max-height:40px;overflow-y:auto}

/* Config */
.config-body{display:none}
.config-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.config-row label{font-size:12px;color:#999;min-width:55px}
.config-row select{padding:5px 8px;border-radius:6px;border:1px solid #444;background:#2A2A2A;color:#fff;font-size:12px}
.pin-grid{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.pin-chip{padding:4px 8px;border-radius:6px;background:#2A2A2A;border:1px solid #444;font-size:11px;cursor:pointer;transition:all .15s}
.pin-chip:hover{border-color:#00D9FF}
.pin-chip.sel-in{background:rgba(255,152,0,.15);border-color:#FF9800;color:#FFB74D}
.pin-chip.sel-out{background:rgba(76,175,80,.15);border-color:#4CAF50;color:#81C784}

/* Pinout */
.pinout-box{display:flex;align-items:center;justify-content:center;min-height:200px}
.esp32-pinout-svg{width:100%;max-width:240px;height:auto}

/* Rule canvas */
.rule-canvas{position:relative;min-height:340px;background:#181c20;border:1px solid #2a2e34;border-radius:14px;overflow:hidden}
.rule-canvas.drag-over{border-color:#00D9FF;box-shadow:inset 0 0 20px rgba(0,217,255,.08)}
.canvas-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-size:13px;pointer-events:none;text-align:center}
.canvas-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.canvas-line{stroke:#00D9FF;stroke-width:2;fill:none;opacity:.7;pointer-events:stroke;cursor:pointer}
.canvas-line:hover{opacity:1;stroke-width:3}
.canvas-device{position:absolute;width:170px;background:#252525;border:2px solid #444;border-radius:12px;padding:8px;cursor:move;user-select:none;z-index:2}
.canvas-device.offline{opacity:.5;border-color:#666}
.canvas-device.type-headband{border-color:#7c4dff}
.canvas-device .cd-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.canvas-device .cd-name{font-size:11px;font-weight:600;color:#eaf8ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.canvas-device .cd-status{font-size:9px;color:#888}
.canvas-device .cd-remove{cursor:pointer;color:#f44;font-size:14px}
.canvas-device .cd-pins{display:flex;flex-direction:column;gap:2px}
.canvas-device .cd-pin{display:flex;align-items:center;gap:5px;font-size:10px;padding:3px 5px;border-radius:4px;cursor:crosshair;transition:background .15s}
.canvas-device .cd-pin:hover{background:rgba(0,217,255,.12)}
.canvas-device .cd-pin .pin-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.canvas-device .cd-pin.input .pin-dot{background:#FF9800}
.canvas-device .cd-pin.output .pin-dot{background:#4CAF50}
.canvas-device .cd-pin.signal .pin-dot{background:#7c4dff}

/* Logic blocks palette + nodes */
.logic-palette{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;max-height:72px;overflow-y:auto}
.logic-palette-btn{padding:4px 8px;border-radius:6px;border:1px solid #444;background:#252525;color:#ccc;font-size:10px;cursor:pointer;white-space:nowrap}
.logic-palette-btn:hover{border-color:#7c4dff;color:#fff}
.canvas-logic{position:absolute;min-width:120px;background:#2a2438;border:2px solid #7c4dff;border-radius:10px;padding:6px 8px;cursor:grab;z-index:2;user-select:none}
.canvas-logic .lg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.canvas-logic .lg-name{font-size:11px;font-weight:700;color:#ce93d8}
.canvas-logic .lg-remove{cursor:pointer;color:#f44;font-size:14px;line-height:1}
.canvas-logic .lg-pins{display:flex;flex-direction:column;gap:3px}
.canvas-logic .lg-pin{font-size:10px;padding:2px 6px;border-radius:4px;display:flex;align-items:center;gap:4px;cursor:crosshair}
.canvas-logic .lg-pin.sink{background:rgba(255,152,0,.12);color:#ffb74d}
.canvas-logic .lg-pin.source{background:rgba(76,175,80,.12);color:#81c784;justify-content:flex-end}
.canvas-logic .lg-pin .pin-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.canvas-logic .lg-params{margin-top:4px;border-top:1px solid #444;padding-top:4px}
.canvas-logic .lg-params input,.canvas-logic .lg-params select{width:100%;font-size:9px;padding:2px 4px;margin-top:2px;background:#1a1a1a;border:1px solid #555;color:#eee;border-radius:3px}
.canvas-logic .lg-params textarea{width:100%;min-height:36px;font-size:9px;font-family:monospace;background:#1a1a1a;border:1px solid #555;color:#eee;border-radius:3px;resize:vertical}
.canvas-line.logic{stroke:#7c4dff}

/* Rule set sidebar */
.rl-panel{display:flex;flex-direction:column;gap:6px}
.rl-panel h4{color:#00D9FF;font-size:13px;margin-bottom:4px}
.rl-tab{padding:8px 10px;background:#252525;border:1px solid #333;border-radius:8px;font-size:11px;cursor:pointer;transition:all .15s;color:#aaa}
.rl-tab:hover{border-color:#00D9FF;color:#fff}
.rl-tab.active{border-color:#00D9FF;background:rgba(0,217,255,.08);color:#00D9FF}
.rl-tab .rl-del{margin-left:4px;color:#f44;font-size:10px;cursor:pointer}

/* Radar */
#scan-radar{display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;position:relative}
.radar-circle{width:70px;height:70px;border-radius:50%;border:2px solid rgba(0,217,255,.3);position:relative;overflow:hidden}
.radar-circle::before,.radar-circle::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(0,217,255,.15);top:50%;left:50%;transform:translate(-50%,-50%)}
.radar-circle::before{width:70%;height:70%}.radar-circle::after{width:40%;height:40%}
.radar-sweep{position:absolute;width:35px;height:35px;top:calc(50% - 17px - 12px);left:calc(50% - 17px);border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(0,217,255,.4) 60deg,transparent 60deg);animation:radar-spin 2s linear infinite}
@keyframes radar-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.radar-label{margin-top:5px;color:#00D9FF;font-size:11px;animation:radar-pulse 1.5s ease-in-out infinite}
@keyframes radar-pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body class="app-shell-page"><div class="app-container"><div id="app-sidebar-mount" data-active="devices"></div><div class="main-content"><div class="page-header"><h2>SEEKBCI 控制板管理</h2></div><div class="page-scroll"><div class="pw-page">

<div class="pw-layout">

  <!-- LEFT: Device Discovery (spans full height) -->
  <div class="panel pw-discovery" style="display:flex;flex-direction:column">
    <h4>设备发现</h4>
    <div class="scan-row"><button class="btn btn-primary" id="btn-scan">扫描控制板</button></div>
    <div class="device-list" id="device-list"><div class="empty-hint">点击扫描发现设备<br>已连接设备可拖入画布</div></div>
    <div class="status-bar" id="status-bar">就绪</div>
  </div>

  <!-- TOP-RIGHT: Config + Pinout side by side -->
  <div class="pw-top-right">
    <div class="panel">
      <h4>设备配置 <span id="config-device-name" style="color:#aaa;font-size:12px;font-weight:normal"></span></h4>
      <div id="config-empty" class="empty-hint" style="padding:12px">选中已连接设备</div>
      <div id="config-body" class="config-body">
        <div class="config-row"><label>角色</label><select id="cfg-role"><option value="input">控制端 (INPUT)</option><option value="output">被控端 (OUTPUT)</option></select></div>
        <div id="cfg-input" style="display:none">
          <div class="config-row"><label>数字输入</label></div><div class="pin-grid" id="pins-din"></div>
          <div class="config-row"><label>ADC</label></div><div class="pin-grid" id="pins-adc"></div>
        </div>
        <div id="cfg-output" style="display:none">
          <div class="config-row"><label>GPIO</label></div><div class="pin-grid" id="pins-dout"></div>
          <div class="config-row"><label>PWM</label></div><div class="pin-grid" id="pins-pwm"></div>
          <div class="config-row"><label>DAC</label></div><div class="pin-grid" id="pins-dac"></div>
          <div class="config-row"><label>舵机</label></div><div class="pin-grid" id="pins-servo"></div>
        </div>
        <button class="btn btn-primary btn-sm" id="btn-save-config" style="margin-top:10px">保存配置</button>
      </div>
    </div>
    <div class="panel">
      <h4>引脚排布</h4>
      <div class="pinout-box" id="pinout-container"><div class="empty-hint" style="font-size:12px">选中设备后显示</div></div>
    </div>
  </div>

  <!-- BOTTOM-RIGHT: Rule Canvas + Rule Set list -->
  <div class="pw-bottom-right">
    <div class="rule-canvas" id="rule-canvas">
      <div class="logic-palette" id="logic-palette"></div>
      <svg class="canvas-svg" id="canvas-svg"></svg>
      <div class="canvas-hint" id="canvas-hint">将已连接设备拖入此区域<br>插入逻辑块：源→逻辑→汇，建立规则</div>
    </div>
    <div class="rl-panel">
      <h4>规则集</h4>
      <button class="btn btn-green btn-sm" id="btn-rule-new" style="width:100%">+ 新建</button>
      <button class="btn btn-danger btn-sm" id="btn-rule-apply" style="width:100%">应用规则</button>
      <button class="btn btn-orange btn-sm" id="btn-rule-stop" style="width:100%">停止</button>
      <button class="btn btn-danger btn-sm" id="btn-rule-clear" style="width:100%">清空</button>
      <div id="rl-tabs" style="display:flex;flex-direction:column;gap:4px;margin-top:6px"></div>
    </div>
  </div>

</div><!-- pw-layout -->

</div></div></div></div>
<script src="js/app-sidebar.js?v=20260714g"></script>
<script src="js/global-device-manager.js?v=20260714g"></script>
<script src="js/esp32-pinout.js?v=20260808"></script>
<script src="js/logic-blocks.js?v=20260815"></script>
<script src="js/physical-world-ctrl.js?v=20260815"></script>
</body></html>
